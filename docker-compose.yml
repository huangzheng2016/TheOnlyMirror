services:
  the_only_mirror:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 50242:8080
    volumes:
      - ./config.json:/app/config.json
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -Y off -O /dev/null http://127.0.0.1:8080/api/services || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
